<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <form id="login">
        <input type="text" name="username" placeholder="email de login">
        <input type="password" name="password" placeholder="senha">
        <button>entrar</button>
    </form>
    <form id="cadastro">
        <input type="text" name="username" placeholder="email de login">
        <input type="password" name="password" placeholder="senha">
        <button>cadastrar-se</button>
    </form>
    <script>
        const frmLogin = document.querySelector('#login')
        const frmcadastro = document.querySelector('#cadastro')


        frmLogin.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "password": frmLogin.password.value
                })
            })

            if (response.status == 404)
                return alert("Usuário não encontrado")

            if (response.status == 401)
                return alert("Senha incorreta")

            if (response.ok) {
                window.location.href = "/home"
                return
            }
        }) 
        
        frmcadastro.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const responseCadastro = await fetch("/cadastro", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmcadastro.username.value,
                    "password": frmcadastro.password.value
                })
            }
        )
          if(responseCadastro.ok){
          alert("deu certo")
          }}
        
    )
    </script>
</body>

</html>
